services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: pmkpi, POSTGRES_PASSWORD: pmkpi, POSTGRES_DB: pmkpi}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U pmkpi"], interval: 5s, retries: 10}
  migrate:
    build: .
    env_file: .env
    command: sh -c "alembic upgrade head && python -m app.cli seed"
    depends_on: {db: {condition: service_healthy}}
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes: [uploads:/data/uploads]
    depends_on: {migrate: {condition: service_completed_successfully}}
  cron-alerts:           # 3.2 cảnh báo + 3.3 snapshot chỉ số, chạy mỗi 30 phút / đêm
    build: .
    env_file: .env
    entrypoint: sh -c "while true; do python -m app.cli scan-alerts; python -m app.cli snapshot-all; sleep 1800; done"
    depends_on: {migrate: {condition: service_completed_successfully}}
volumes: {pgdata: {}, uploads: {}}
